{% extends "commerce/base.html" %}

{% block content %}
    <h2>Liste des Catégories</h2>
    <a href="{% url 'ajouter_categorie' %}" class="btn btn-primary">Ajouter une catégorie</a>
    <table class="table mt-3">
        <thead>
            <tr>
                <th>Nom</th>
                <th>Description</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for categorie in categories %}
                <tr>
                    <td>{{ categorie.nom }}</td>
                    <td>{{ categorie.description }}</td>
                    <td>
                        <a href="{% url 'modifier_categorie' categorie.pk %}" class="btn btn-warning btn-sm">Modifier</a>
                        <a href="{% url 'supprimer_categorie' categorie.pk %}" class="btn btn-danger btn-sm">Supprimer</a>
                    </td>
                </tr>
            {% empty %}
                <tr><td colspan="3">Aucune catégorie disponible.</td></tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
