{% extends "commerce/base.html" %}

{% block content %}
    <h2>Supprimer la commande #{{ commande.id }} ?</h2>
    <p>Êtes-vous sûr de vouloir supprimer cette commande ? Cette action est irréversible.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Supprimer</button>
        <a href="{% url 'liste_commandes' %}" class="btn btn-secondary">Annuler</a>
    </form>
{% endblock %}
